[project]
name = "hyp-gen"
version = "0.1.0"
description = "A knowledge graph in, one hypothesis out"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hypgen = "hyp_gen.cli:main"
hypreport = "adapters.report.cli:main"
hypwebui = "adapters.webui.cli:main"
hypvaluation = "adapters.valuation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hyp_gen", "adapters"]

[tool.pytest.ini_options]
pythonpath = ["src", "tools", ".", "tests"]
testpaths = ["tests"]
